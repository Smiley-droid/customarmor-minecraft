name: Build Paper Plugin

on:
  push:
    paths:
      - "paper-plugin/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build with Maven
        run: mvn -B -f paper-plugin/pom.xml clean package

      - name: Upload compiled plugin
        uses: actions/upload-artifact@v4
        with:
          name: CustomArmorTools
          path: paper-plugin/target/CustomArmorTools.jar
